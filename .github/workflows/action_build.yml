name: Build Action Release

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:

# 供 fork 的自动发布步骤使用：创建/更新 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.zip_chrome.outputs.extensionVersion }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '1' || '0' }} # 根据事件类型动态设置 fetch-depth

      # pnpm 版本取自 package.json 的 packageManager 字段（当前为 pnpm@12.10.1），此处不要再用 version 输入指定
      # 注意：安装 pnpm v12 需要 pnpm/action-setup >= v6.1.0（当前 v6 浮动标签已指向 v6.1.0）
      - uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ">=23.7.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: vue-tsc check
        run: pnpm check
        # PR 上严格检查；push / 手动派发（自动同步后触发）只做构建，避免类型检查波动挡住发版
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Build Output
        run: |
          pnpm build:dist
          pnpm build:dist-firefox

      - name: Upload Chrome Built to action
        uses: actions/upload-artifact@v7
        with:
          name: build-dist-chrome
          path: dist-chrome

      - name: Upload Firefox Built to action
        uses: actions/upload-artifact@v7
        with:
          name: build-dist-firefox
          path: dist-firefox

      - run: mkdir -p build-zip

      - id: zip_chrome
        name: Build Zip For Chrome
        uses: cardinalby/webext-buildtools-pack-extension-dir-action@v1
        with:
          extensionDir: "dist-chrome"
          zipFilePath: "build/extension-chrome.zip"

      - id: zip_firefox
        name: Build Zip For Firefox
        uses: cardinalby/webext-buildtools-pack-extension-dir-action@v1
        with:
          extensionDir: "dist-firefox"
          zipFilePath: "build/extension-firefox.zip"

      - name: Upload Built Zip to action
        uses: actions/upload-artifact@v7
        with:
          name: build-zip-${{ steps.zip_chrome.outputs.extensionVersion }}
          path: build/*.zip

      - name: Build Self-Sign Crx For Chrome
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        env:
          CHROME_SELF_SIGN_CRX_PRIVATE_KEY: ${{ secrets.CHROME_SELF_SIGN_CRX_PRIVATE_KEY }}
        if: ${{ env.CHROME_SELF_SIGN_CRX_PRIVATE_KEY != ''  }}
        with:
          zipFilePath: "build/extension-chrome.zip"
          crxFilePath: "build/extension.crx"
          privateKey: "${{ secrets.CHROME_SELF_SIGN_CRX_PRIVATE_KEY }}"

      - name: Upload Built Crx to action
        uses: actions/upload-artifact@v7
        with:
          path: build/extension.crx
          name: build-crx-${{ steps.zip_chrome.outputs.extensionVersion }}

      - name: Upload build folder to Telegram Channel
        env:
          BUILD_VERSION: ${{ steps.zip_chrome.outputs.extensionVersion }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: pnpm action:upload_telegram
        continue-on-error: true

      # ---------------------------------------------------------------------
      # fork 专用：把每次 master 推送的 Chrome 构建发布到固定 tag 的 Release，
      # 这样直接下载 extension-chrome.zip 解压后「加载已解压的扩展程序」即可。
      # ---------------------------------------------------------------------
      - name: Write install note into build
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && github.repository == 'jadylc/PT-depiler' }}
        run: |
          cat > build/安装说明.txt <<'EOF'
          PT-depiler 自动构建（含搜索结果跨站聚合）

          安装：
            1. 解压 extension-chrome.zip 到任意固定目录（例如 D:\PT-depiler-build）
            2. 打开 chrome://extensions/ 或 edge://extensions/
            3. 打开右上角「开发者模式」
            4. 点「加载已解压的扩展程序」，选择解压出来的目录（包含 manifest.json 的那一层）

          注意：
            - 已安装商店版的话，建议先在扩展页停用商店版，避免两个版本同时工作。
            - 本构建每次 master 推送都会覆盖同名 Release 资产，重新下载解压覆盖目录后，
              在扩展页点一次「重新加载」即可升级。
          EOF
          ls -l build/

      - name: Publish build to Release
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && github.repository == 'jadylc/PT-depiler' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Latest auto build
          body: |
            自动构建（推送 ${{ github.sha }}）

            下载 `extension-chrome.zip` 后解压，在 `chrome://extensions`（或 `edge://extensions`）打开开发者模式，
            选择「加载已解压的扩展程序」并指向解压目录即可。

            本次构建包含「搜索结果跨站聚合」视图：同一部影片/同一条种子会按站点数量排序，展开即可挑选站点下载。
          files: |
            build/extension-chrome.zip
            build/安装说明.txt
          overwrite_files: true
          make_latest: false
